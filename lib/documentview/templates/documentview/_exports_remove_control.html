<div class="dv-export-controls">
  <form method="post" action="{% url 'documentview:active_remove' %}" class="dv-active-form">
    {% csrf_token %}
    <input type="hidden" name="link_name" value="{{ link_name }}">
    <input type="hidden" name="rel_path" value="{{ rel_path }}">
    <input type="hidden" name="return_to" value="{{ request.get_full_path }}">
    <button type="submit">Remove from exports</button>
  </form>
</div>
