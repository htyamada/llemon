# documentview default configuration — do not edit.
# Maintained in the grove repository at etc/documentview.conf.
# Edit this file to customise documentview paths.
#
#   [hty7.documentview.core]
#   # Collection root to browse (required, no default):
#   root = "/srv/cloud/store/books-and-text/"
#   # Directory where active-reader symlinks are staged (required, no default):
#   active_dir = "~/var/documentview/reader"
#   # Optional: JSON manifest tracking those symlinks
#   # (default: ~/var/documentview/state/active_manifest.json):
#   active_manifest = "~/var/documentview/state/active_manifest.json"
#
#   [qat.documentview.core]
#   root = "/srv/ext/qat/books-and-text/"
#   active_dir = "~/var/qat/documentview/reader"

[hty7.documentview.core]
root = "/srv/cloud/store/books-and-text/"
active_dir = "~/var/documentview/reader"
active_manifest = "~/var/documentview/state/active_manifest.json"
